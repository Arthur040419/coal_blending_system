spring:
  application:
    name: coal-blending-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:coal_blending_system}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:Gt1303190518*}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto

server:
  port: ${SERVER_PORT:8080}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.coalblend.mapper: debug

# 大模型解释生成：为 false 时不发起 HTTP，直接使用兜底文案（无密钥/离线开发可设 false）
coal:
  blend:
    # 当前实验阶段默认关闭系统枚举，仅使用 AI 候选 + 既有评分标准，便于优化前后对比。
    # 如需恢复系统枚举，可设置 COAL_BLEND_ENABLE_SYSTEM_ENUMERATION=true。
    enable-system-enumeration: ${COAL_BLEND_ENABLE_SYSTEM_ENUMERATION:false}
    optimization:
      ratio-step: 0.05
      max-shortlist-coals: 8
      max-material-count: 3
      max-return-plans: 6
      max-evaluated-candidates: 25000
      min-single-ratio: 0.05
      high-single-ratio-threshold: 0.75
      low-inventory-margin-rate: 0.10
      low-quality-margin-rate: 0.05
      low-calorific-margin-rate: 0.02
  llm:
    enabled: ${COAL_LLM_ENABLED:true}
    connect-timeout: ${COAL_LLM_CONNECT_TIMEOUT:30s}
    read-timeout: ${COAL_LLM_READ_TIMEOUT:10m}
    # <= 0 表示不主动传 max_tokens，避免系统侧截断模型输出
    max-tokens: ${COAL_LLM_MAX_TOKENS:0}
    fallback-explanation: "系统根据订单质量约束、库存情况和规则知识生成了当前推荐方案。该方案综合考虑成本与约束可行性，具有较好的执行可行性。"
    fallback-rule-basis: "当前为系统兜底说明：未调用大模型时无法自动生成与命中规则一一对应的依据条文，请在启用模型后重新生成方案。"
    fallback-risk-tip: "请关注库存余量与现场执行偏差，以上为系统兜底风险提示。"
    fallback-optimize-suggestion: "可在「模型配置」中填写兼容 OpenAI Chat Completions 的接口地址与密钥，并将状态设为启用后重新生成方案，以获得大模型生成的细化建议。"
  rag:
    vector-enabled: ${COAL_RAG_VECTOR_ENABLED:true}
    qdrant-url: ${COAL_RAG_QDRANT_URL:http://127.0.0.1:6333}
    qdrant-api-key: ${COAL_RAG_QDRANT_API_KEY:}
    collection-name: ${COAL_RAG_COLLECTION:coal_rag_chunks}
    vector-size: ${COAL_RAG_VECTOR_SIZE:1024}
    embedding-api-url: ${COAL_RAG_EMBEDDING_API_URL:http://127.0.0.1:11434/api/embed}
    embedding-model: ${COAL_RAG_EMBEDDING_MODEL:bge-m3}
    fallback-hash-embedding: ${COAL_RAG_FALLBACK_HASH_EMBEDDING:true}
    chunk-max-chars: ${COAL_RAG_CHUNK_MAX_CHARS:700}
    chunk-overlap-chars: ${COAL_RAG_CHUNK_OVERLAP_CHARS:80}
    vector-weight: ${COAL_RAG_VECTOR_WEIGHT:0.60}
    keyword-weight: ${COAL_RAG_KEYWORD_WEIGHT:0.30}
    business-weight: ${COAL_RAG_BUSINESS_WEIGHT:0.10}
